spring:
  application:
    name: teduh-claims
  servlet:
    multipart:
      # Just above the app's own limits (10 MB a file, 5 files), so the app's checks answer first with a
      # message about the file, and only something far larger is cut off here.
      max-file-size: 11MB
      max-request-size: 60MB
  jpa:
    # Each service method loads what it needs inside its own transaction.
    # Spring Boot's default (true) keeps a database session open for the whole web request.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match the tables,
      # and refuses to start if they don't. It never changes a table itself.
      ddl-auto: validate
  mvc:
    # Spring's own errors (bad JSON, a missing field) come back in the same RFC 9457 shape as ours.
    problemdetails:
      enabled: true
  modulith:
    events:
      jdbc:
        # The event_publication table comes from our own Flyway migration (V2), not from Modulith.
        schema-initialization:
          enabled: false

server:
  servlet:
    session:
      # Signed out after 30 minutes without a request.
      timeout: 30m
      cookie:
        # The session cookie: JavaScript can't read it (http-only), it only travels over HTTPS (secure;
        # browsers make an exception for http://localhost), and other sites' pages can't make the browser
        # send it with their POSTs (same-site lax).
        http-only: true
        secure: true
        same-site: lax

teduh:
  storage:
    # Where documents go. Set exactly one of these outside this file:
    #   connection-string: Azurite, locally and in tests (the tests set it themselves)
    #   endpoint: the storage account in Azure, reached with the app's managed identity
    container: claim-documents

logging:
  level:
    # Azure's Java-HttpClient adapter warns on every upload that it can't set Content-Length itself.
    # Java's HttpClient sets that header from the body's size anyway, so the warning is only noise.
    com.azure.core.http.jdk.httpclient.JdkHttpClient: error
